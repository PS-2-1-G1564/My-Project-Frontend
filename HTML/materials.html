        <!-- Main Content -->
        <main id="main-content">

    <section class="materials-section">

        <div class="materials-heading">
            <p class="section-tag">CRYSTALVOLT / MATERIAL ANALYSIS</p>

            <h1>Explore Your <span>Battery Material</span></h1>

            <p>
                Enter your electrode material details to predict
                its voltage using machine learning.
            </p>
        </div>

        <div class="materials-container">

            <!-- Input Form -->
            <div class="input-panel">

                <h2>Material Information</h2>

                <div class="input-group">
                    <label for="electrode-formula">Electrode Formula</label>
                    <input
                        type="text"
                        id="electrode-formula"
                        placeholder="Example: LiFePO4"
                    >
                </div>

                <div class="input-group">
                    <label for="metal-type">Type of Metal</label>

                    <select id="metal-type">
                        <option value="">Select working metal</option>
                        <option value="Li">Lithium (Li)</option>
                        <option value="Na">Sodium (Na)</option>
                        <option value="K">Potassium (K)</option>
                        <option value="Mg">Magnesium (Mg)</option>
                        <option value="Ca">Calcium (Ca)</option>
                        <option value="Al">Aluminium (Al)</option>
                        <option value="Zn">Zinc (Zn)</option>
                        <option value="Y">Yttrium (Y)</option>
                    </select>
                </div>

                <button type="button" class="results-button">
                    Get Results <span>→</span>
                </button>

            </div>

            <!-- Battery Visual Area -->
            <!-- Battery Visual Area -->
<div class="battery-visual">

    <img
        src="../ASSETS/images/crystal-battery.png"
        alt="CrystalVolt futuristic battery"
        class="battery-image"
    >

</div>
